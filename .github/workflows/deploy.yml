name: deploy-pages

# Branchless GitHub Pages deployment, pull-based: assembles the site from
# this repository (haddock API docs, landing pages) plus the `tutorial`
# artifact rendered by hasktorch/hasktorch's cabal-linux workflow.
#
# The hourly schedule polls hasktorch for a new successful master build and
# deploys only when one exists (the id of the deployed build is published at
# /tutorial/.build-id and compared).  Pushes to this repository and manual
# dispatches always deploy.  No cross-repository secrets are involved.
#
# Requires Pages to be configured with Source: "GitHub Actions".

on:
  push:
    branches: [master]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for a new tutorial build
        id: check
        run: |
          latest=$(curl -s "https://api.github.com/repos/hasktorch/hasktorch/actions/workflows/cabal-linux.yml/runs?branch=master&status=success&per_page=1" \
                   | jq -r '.workflow_runs[0].id // "none"')
          deployed=$(curl -sf https://hasktorch.github.io/tutorial/.build-id || echo unknown)
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$latest" = "$deployed" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "tutorial build $latest already deployed; nothing to do"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble site
        if: steps.check.outputs.skip == 'false'
        run: |
          mkdir -p /tmp/site
          rsync -a --exclude .git --exclude .github ./ /tmp/site/

      - name: Fetch the tutorial from hasktorch CI
        if: steps.check.outputs.skip == 'false'
        uses: dawidd6/action-download-artifact@v6
        with:
          repo: hasktorch/hasktorch
          run_id: ${{ steps.check.outputs.latest }}
          name: tutorial
          path: /tmp/site/tutorial

      - name: Record the deployed build
        if: steps.check.outputs.skip == 'false'
        run: echo "${{ steps.check.outputs.latest }}" > /tmp/site/tutorial/.build-id

      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.skip == 'false'
        with:
          path: /tmp/site

      - id: deployment
        if: steps.check.outputs.skip == 'false'
        uses: actions/deploy-pages@v4
