name: deploy-pages

# Branchless GitHub Pages deployment, pull-based: assembles the site from
# this repository (haddock API docs, landing pages) plus the `tutorial`
# artifact rendered by hasktorch/hasktorch's cabal-linux workflow.
#
# Deploys on pushes to this repository and on manual dispatch (the "Run
# workflow" button) — run it after merging hasktorch changes whose rendered
# tutorial should go live.  It always fetches the newest successful master
# build's tutorial artifact, and the deployed build's id is published at
# /tutorial/.build-id.  No cross-repository secrets are involved.
#
# (An hourly schedule used to poll hasktorch for new builds; it was dropped
# because the stream of scheduled runs was noise — manual dispatch is
# enough.)
#
# Requires Pages to be configured with Source: "GitHub Actions".

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Find the latest tutorial build
        id: check
        run: |
          latest=$(curl -s "https://api.github.com/repos/hasktorch/hasktorch/actions/workflows/cabal-linux.yml/runs?branch=master&status=success&per_page=1" \
                   | jq -r '.workflow_runs[0].id // "none"')
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Assemble site
        run: |
          mkdir -p /tmp/site
          rsync -a --exclude .git --exclude .github ./ /tmp/site/

      - name: Fetch the tutorial from hasktorch CI
        uses: dawidd6/action-download-artifact@v6
        with:
          repo: hasktorch/hasktorch
          run_id: ${{ steps.check.outputs.latest }}
          name: tutorial
          path: /tmp/site/tutorial

      - name: Record the deployed build
        run: echo "${{ steps.check.outputs.latest }}" > /tmp/site/tutorial/.build-id

      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site

      - id: deployment
        uses: actions/deploy-pages@v4
